spring.application.name=banking-api
spring.config.import=optional:file:./backend/config/.env[.properties],optional:file:./config/.env[.properties]
server.port=${SERVER_PORT:8080}
spring.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true
app.jwt.secret=${JWT_SECRET}
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
app.auth.allow-plaintext-demo-passwords=true
